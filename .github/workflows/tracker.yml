name: BMS Automated Tracker

on:
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        show: 
          - { id: "6248", venue_code: "ALUC", venue_name: "ALLU Cinemas: Kokapet", event_code: "ET00523252", movie_name: "Namit Malhotra's Ramayana (DOLBY CINEMA 3D) (Telugu) - Telugu", time: "07:00 AM", date_code: "20261105", display: "05-Nov-2026", screen: "DOLBY CINEMA (SCREEN 1)" }
          - { id: "6324", venue_code: "ALUC", venue_name: "ALLU Cinemas: Kokapet", event_code: "ET00523252", movie_name: "Namit Malhotra's Ramayana (DOLBY CINEMA 3D) (Telugu) - Telugu", time: "07:02 PM", date_code: "20261105", display: "05-Nov-2026", screen: "DOLBY CINEMA (SCREEN 1)" }
          - { id: "6328", venue_code: "ALUC", venue_name: "ALLU Cinemas: Kokapet", event_code: "ET00523252", movie_name: "Namit Malhotra's Ramayana (DOLBY CINEMA 3D) (Telugu) - Telugu", time: "07:00 AM", date_code: "20261106", display: "06-Nov-2026", screen: "DOLBY CINEMA (SCREEN 1)" }
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CITY_CODE: "hyd"
      VENUE_CODE: ${{ matrix.show.venue_code }}
      VENUE_NAME: ${{ matrix.show.venue_name }}
      TARGET_EVENT: ${{ matrix.show.event_code }}
      MOVIE_NAME: ${{ matrix.show.movie_name }}
      TARGET_SESSION_ID: ${{ matrix.show.id }}
      TARGET_SHOW_TIME: ${{ matrix.show.time }}
      TARGET_DATE_CODE: ${{ matrix.show.date_code }}
      TARGET_DISPLAY_DATE: ${{ matrix.show.display }}
      TARGET_SCREEN: ${{ matrix.show.screen }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Network Engine
        run: pip install curl_cffi

      - name: Run Seat Tracker
        run: python bms_swarm.py

      - name: Notify on Stop
        if: cancelled() || failure()
        run: python bms_swarm.py --notify-stop "GitHub Workflow ${{ job.status }}"

      - name: Commit State Relay
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          STATE_FILE="state_${{ matrix.show.venue_code }}_${{ matrix.show.id }}.json"
          touch "$STATE_FILE"
          git add "$STATE_FILE"
          
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Relay state for ${{ matrix.show.venue_code }} ${{ matrix.show.id }}"
            for i in {1..5}; do
              git pull --rebase origin main
              if git push origin main; then
                echo "State successfully relayed!"
                break
              else
                echo "Collision detected. Retrying..."
                sleep $((RANDOM % 10 + 2))
              fi
            done
          fi

  # ==========================================================================
  # 24/7 SELF-RELAY JOB: Automatically starts the next 6-hour shift on success!
  # ==========================================================================
  relay:
    needs: track
    if: success()
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger Next 6-Hour Cycle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "BMS Automated Tracker" --ref main
